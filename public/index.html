<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniViewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Icon-only sidebar (MaiChartManager style) -->
    <aside id="sidebar">
      <div class="sb-logo" title="UniViewer">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <nav id="nav-icons">
        <button class="sb-icon" data-cat="charts" title="谱面">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        </button>
        <button class="sb-icon" data-cat="characters" title="角色">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
        <button class="sb-icon" data-cat="avatars" title="虚拟形象">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        </button>
        <button class="sb-icon" data-cat="collectibles" title="收藏品">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
        </button>
        <button class="sb-icon" data-cat="others" title="其他">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        </button>
      </nav>
      <div class="sb-bottom">
        <button class="sb-icon" id="btn-refresh" title="刷新">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="sb-icon" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
      <div class="sb-version" id="sb-version">v0.0.1.alpha.1</div>
    </aside>

    <!-- List column (left of detail) -->
    <section id="list-pane">
      <header id="list-header">
        <div class="lh-left">
          <select id="source-select" class="hdr-select hdr-select-version"></select>
        </div>
        <div class="lh-right">
          <div class="hdr-card" id="sort-card">
            <div class="hdr-card-main" id="sort-card-main">
              <span class="hdr-card-sort" id="sort-card-label">ID</span>
              <svg class="hdr-card-caret" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="hdr-card-dropdown hidden" id="sort-dropdown">
              <div class="hdr-card-dropdown-inner" id="sort-dropdown-inner">
                <button class="hdr-dropdown-item" data-sort="id" data-i18n="sortById">ID</button>
                <button class="hdr-dropdown-item" data-sort="name" data-i18n="sortByName">名称</button>
                <button class="hdr-dropdown-item" data-sort="date" data-i18n="sortByDate">更新时间</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div id="sub-nav" class="sub-nav hidden">
        <div class="sub-nav-inner" id="sub-nav-inner"></div>
      </div>

      <div id="list-body" class="list-body">
        <div class="loading">加载中...</div>
      </div>
    </section>

    <!-- Detail pane (right) -->
    <section id="detail-pane">
      <div id="detail-content" class="detail-empty">
        <div class="empty-hint">从左侧选择一个项目以查看详情</div>
      </div>
    </section>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>设置</h3>
        <button class="modal-close" data-modal="settings-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>语言</label>
          <select id="setting-language" disabled>
            <option value="zh-CN" selected>简体中文</option>
          </select>
        </div>
        <div class="form-group">
          <label>游戏数据</label>
          <div class="path-row">
            <input type="text" id="setting-path" placeholder="D:\SDHD_2.50">
            <button class="btn-secondary" id="path-browse">浏览</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="settings-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- About Modal -->
  <div id="about-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>关于</h3>
        <button class="modal-close" data-modal="about-modal">&times;</button>
      </div>
      <div class="modal-body about-body">
        <div class="about-logo">
          <svg class="about-logo-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
          <h2>UniViewer</h2>
        </div>
        <p>版本: <strong>Ver.0.0.1.alpha.1</strong></p>
        <p>游戏版本: <strong id="about-game-version">-</strong></p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
